source = { editable = "." }
dependencies = [
    { name = "beartype" },
    { name = "jinja2" },
    { name = "python-multipart" },
    { name = "starlette" },
    { name = "torch", version = "2.8.0", source = { registry = "https://download.pytorch.org/whl/cpu" }, marker = "sys_platform == 'darwin'" },
    { name = "torch", version = "2.8.0+cpu", source = { registry = "https://download.pytorch.org/whl/cpu" }, marker = "sys_platform != 'darwin' and sys_platform != 'linux'" },
    { name = "torch", version = "2.8.0+cu128", source = { registry = "https://download.pytorch.org/whl/cu128" }, marker = "sys_platform == 'linux'" },
    { name = "transformers" },
    { name = "uvicorn" },
]

[package.dev-dependencies]
dev = [
    { name = "beautifulsoup4" },
    { name = "httpx" },
    { name = "huggingface-hub", extra = ["cli"] },
    { name = "mypy" },
    { name = "pytest-cov" },
    { name = "pytest-watcher" },
    { name = "ruff" },
    { name = "syrupy" },
]

[package.metadata]
requires-dist = [
    { name = "beartype", specifier = ">=0.21.0" },
    { name = "jinja2", specifier = ">=3.1.4" },
    { name = "python-multipart", specifier = ">=0.0.20" },
    { name = "starlette", specifier = ">=0.47.0" },
    { name = "torch", marker = "sys_platform != 'linux'", specifier = ">=2.8.0", index = "https://download.pytorch.org/whl/cpu" },
    { name = "torch", marker = "sys_platform == 'linux'", specifier = ">=2.8.0", index = "https://download.pytorch.org/whl/cu128" },
    { name = "transformers", specifier = ">=4.55.2" },
    { name = "uvicorn", specifier = ">=0.34.2" },
]

[package.metadata.requires-dev]
dev = [
    { name = "beautifulsoup4", specifier = ">=4.13.4" },
    { name = "httpx", specifier = ">=0.28.1" },
    { name = "huggingface-hub", extras = ["cli"], specifier = ">=0.34.4" },
    { name = "mypy", specifier = ">=1.15.0" },
    { name = "pytest-cov", specifier = ">=6.2.1" },
    { name = "pytest-watcher", specifier = ">=0.4.3" },
    { name = "ruff", specifier = ">=0.11.10" },
    { name = "syrupy", specifier = ">=4.9.1" },
]
