---
# PLANNED: migrate to hk (see: https://github.com/KyleKing/yak-shears/blob/b0f2bdfb741f7533985cf664270bb9eaa548b8f7/hk.pkl)

# Common commands:
# pre-commit install
# pre-commit autoupdate
# pre-commit run --all-files mdformat
# pre-commit run --all-files --hook-stage commit
# pre-commit run --all-files --hook-stage push
# uv run calcipy lint.pre-commit --no-update
#
# See https://pre-commit.com for more information
#  and https://pre-commit.com/hooks.html for more hooks

# Only commit is installed by default: https://pre-commit.com/#pre-commit-install
# Pending rename of pre-push from: https://github.com/pre-commit/pre-commit/issues/2732
default_install_hook_types: ["commit-msg", "pre-commit", "pre-push"]

exclude: .+\.min\.js

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-yaml
        args: [--unsafe]
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: \.copier-answers\.yml|__snapshots__/.*\.ambr
      - id: fix-byte-order-marker
      - id: forbid-new-submodules
      - id: mixed-line-ending
        args: [--fix=auto]
      - id: trailing-whitespace
        exclude: __snapshots__/.*\.ambr
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.9.1
    hooks:
      - id: commitizen
  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.22
    hooks:
      - id: mdformat
        additional_dependencies:
          - "mdformat-mkdocs[recommended]>=3.0.0"
          - "mdformat-gfm-alerts>=1.0.1"
        args: [--wrap=no]
        exclude: _.+\.md|CHANGELOG\.md|CODE_TAG_SUMMARY\.md
        stages: ["pre-commit"]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
        stages: ["pre-commit"]
  - repo: https://github.com/pappasam/toml-sort
    rev: v0.24.3
    hooks:
      - id: toml-sort-fix
        exclude: uv\.lock|mise\.toml
        stages: ["pre-commit"]
