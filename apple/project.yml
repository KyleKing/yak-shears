# XcodeGen spec. `xcodegen generate --spec apple/project.yml` writes apple/YakShears.xcodeproj,
# which is not committed: this file is the source of truth for the project.
name: YakShears
options:
  bundleIdPrefix: me.kyleking
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Empty locally until set in Xcode; CI passes the team on the command line.
    DEVELOPMENT_TEAM: ""

packages:
  YakShearsKit:
    path: YakShearsKit

targets:
  YakShears:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "26.0"
      macOS: "26.0"
    sources:
      - path: YakShears
        excludes:
          - "*.entitlements"
      - path: Shared
    dependencies:
      - package: YakShearsKit
      - target: YakShearsShare
        destinationFilters: [iOS]
    info:
      path: YakShears/Info.plist
      properties:
        CFBundleDisplayName: Yak Shears
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # Expose Documents/Vault in the Files app, so yaks can be copied in by hand.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Plain HTTP only to local addresses, so a dev server on the laptop can be synced
        # against from a phone on the same network. Everything else stays HTTPS-only.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.kyleking.yakshears
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: YakShears/YakShears-macOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: YakShears/YakShears-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: YakShears/YakShears-iOS.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  # Share sheet: queues text and links in the App Group inbox for the app to file.
  YakShearsShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: YakShearsShare
        excludes:
          - "*.entitlements"
      - path: Shared
    dependencies:
      - package: YakShearsKit
    info:
      path: YakShearsShare/Info.plist
      properties:
        CFBundleDisplayName: Yak Shears
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.kyleking.yakshears.share
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: YakShearsShare/YakShearsShare.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  YakShears:
    build:
      targets:
        YakShears: all
