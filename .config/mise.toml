[env]
HK_EXCLUDE = "**/*.min.js,**/*.ambr"
MISE_ENV = "hk"
_.python.venv = {path = ".venv"}

[tasks.build]
depends = ['download-assets', 'generate']
description = 'Build generated code'

[tasks.dev]
description = 'Run development server without authentication'
run = 'uv run serve --reload --no-auth'

[tasks.download-assets]
description = "Download production assets"
run = "./scripts/download-assets.sh"

[tasks.format]
description = 'Run code formatting'
run = ['uv run ruff check --fix {{vars.unsafe_fixes}}', "uv run ruff format", "biome format --write", "dprint fmt"]

[tasks.freshness]
description = "Check every pinned version for drift (doneram update patches them)"
run = "doneram check"

[tasks.generate]
description = 'Generate the typed template render functions the app imports'
run = "uv run types-for-jinja wrapper"

[tasks.hooks]
description = "Run git hooks"
dir = "./../" # FYI: required because the default is otherwise `.config/` where these files are located
run = ["hk fix --quiet"]

[tasks.test]
depends = ['generate']
description = 'Run all tests'
run = "uv run pytest --cov=yak_shears --cov-report=html:.cover --cov-report=term-missing --no-cov-on-fail --cov-fail-under=85"

[tasks."test:e2e"]
description = 'Run only E2E tests'
run = "uv run pytest -m 'playwright' --tracing=retain-on-failure --video=off --screenshot=only-on-failure"

[tasks."test:e2e:debug"]
description = 'Debug E2E tests with "Slow Mo". Optionally set PWDEBUG=1'
run = "mise run test:e2e --headed --slowmo=30 -v"

[tasks."test:unit"]
description = 'Run only non-E2E Tests'
run = "mise run test -m 'not playwright'"

[tasks.typecheck]
depends = ['generate']
description = 'Run static type checks'
run = ["uv run mypy"]

[tools]
"npm:@biomejs/biome" = "2.2.4"
"npm:dprint" = "0.50.2"
"npm:terser" = "5.44.0"
"npm:typescript" = "5.9.2"
pkl = "0.32.1"
python = "3.13.7"

[vars]
unsafe_fixes = '' # PLANNED: This doesn't actually work. Previously: `{{option(name="unsafe_fixes")}}`
