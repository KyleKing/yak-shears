#cloud-config
# Hetzner Cloud VPS setup for Yak Shears
# References:
# - https://community.hetzner.com/tutorials/basic-cloud-config
# - https://cloudinit.readthedocs.io/en/latest/reference/examples.html
#
# ⚠️  REQUIRED: Replace placeholders before deployment
#
# CHECKLIST:
# [ ] <public_ssh_key> - Full SSH public key from ~/.ssh/id_ed25519.pub
# [ ] <ntfy_topic> - Random ntfy.sh topic name for deploy notifications
# [ ] yak-shears.kyleking.me - Your domain (in Caddyfile section)
# [ ] dev.act.kyle+caddy@gmail.com - Your email for Let's Encrypt
# [ ] Review passwordless sudo (see DEPLOYMENT.md Security Notes)

# SECURITY NOTE: This configuration grants passwordless sudo for convenience.
# For production, consider restricting to specific commands. See DEPLOYMENT.md.

users:
  - name: yakshears
    groups: users, admin
    sudo: ALL=(ALL) NOPASSWD:ALL  # ⚠️  See security note above
    shell: /bin/bash
    ssh_authorized_keys:
      - <public_ssh_key>  # ⚠️  REPLACE with your SSH public key

packages:
  - fail2ban
  - ufw
  - git
  - curl
  - ffmpeg
  - gnupg2
  - apt-transport-https
  - debian-keyring
  - debian-archive-keyring

package_update: true
package_upgrade: true

write_files:
  # SSH hardening configuration (drop-in file for sshd_config)
  - path: /etc/ssh/sshd_config.d/99-ssh-hardening.conf
    content: |
      # SSH hardening for yak-shears deployment
      PermitRootLogin no
      PasswordAuthentication no
      Port 2222
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      MaxAuthTries 2
      AllowTcpForwarding local  # "local" (not "no") so `ssh -L` can reach Syncthing's UI; "all" would also permit -R
      X11Forwarding no
      AllowAgentForwarding no
      AuthorizedKeysFile .ssh/authorized_keys
      AllowUsers yakshears

  # Yak Shears systemd service
  - path: /etc/systemd/system/yak-shears.service
    content: |
      [Unit]
      Description=Yak Shears Server
      After=network.target

      [Service]
      User=yakshears
      WorkingDirectory=/home/yakshears/yak-shears
      ExecStartPre=/bin/mkdir -p /home/yakshears/.local/state/yak-shears
      ExecStart=/home/yakshears/.local/bin/uv run --no-sync serve --port 8084 --search-db-dir /home/yakshears/.local/state/yak-shears
      Restart=always
      RestartSec=10
      Environment=YAK_SHEARS_DIR=/home/yakshears/Sync/yak-shears
      Environment=IN_TLS_CONTEXT=TRUE

      [Install]
      WantedBy=multi-user.target

  # Deploy notification topic. Anyone who knows an ntfy.sh topic name can read
  # and post to it, so treat this like a secret: keep the filled-in copy out of
  # git and use a random name.
  - path: /etc/yak-shears/deploy.env
    owner: root:yakshears
    permissions: '0640'
    content: |
      NTFY_TOPIC=<ntfy_topic>

  # GitOps update script
  - path: /usr/local/bin/gitops-update.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail

      REPO=KyleKing/yak-shears
      BRANCH=yak-shears-py
      REPO_DIR=/home/yakshears/yak-shears
      HEALTH_URL=http://localhost:8084/auth/status
      # A rolled-back commit still sits at origin/HEAD, so without remembering it
      # the timer redeploys the same broken commit every five minutes.
      FAILED_SHA=/home/yakshears/.local/state/yak-shears/failed-sha

      if [ -f /etc/yak-shears/deploy.env ]; then
        . /etc/yak-shears/deploy.env
      fi

      notify() {
        [ -n "${NTFY_TOPIC:-}" ] || return 0
        curl -fsS -m 10 -o /dev/null \
          -H "Title: yak-shears deploy" -H "Priority: $2" \
          -d "$1" "https://ntfy.sh/$NTFY_TOPIC" || true
      }

      install_and_restart() {
        # --no-dev: the server runs the app, never the test or lint tooling.
        # --frozen: install exactly what uv.lock pins and fail loudly if it is
        # stale, rather than re-resolving. Re-resolving also drags in the dev
        # group's local editable sources, which do not exist on the server.
        /home/yakshears/.local/bin/uv sync --no-dev --frozen
        # The wrappers the app imports are generated code and are gitignored, so
        # a pull never delivers them and the service fails to import without this.
        .venv/bin/types-for-jinja wrapper
        sudo systemctl restart yak-shears
      }

      healthy() {
        for _ in $(seq 30); do
          if curl -fs -m 5 -o /dev/null "$HEALTH_URL"; then
            return 0
          fi
          sleep 1
        done
        return 1
      }

      cd "$REPO_DIR"
      git fetch origin "$BRANCH"

      LOCAL=$(git rev-parse HEAD)
      REMOTE=$(git rev-parse "origin/$BRANCH")

      if [ "$LOCAL" = "$REMOTE" ]; then
        echo "No updates available"
        exit 0
      fi

      if [ "$(cat "$FAILED_SHA" 2>/dev/null || true)" = "$REMOTE" ]; then
        echo "Skipping ${REMOTE:0:8}: it already failed to deploy"
        exit 0
      fi

      # Deploy only what CI proved. GitHub Actions report as check runs rather
      # than as commit statuses, so the /status endpoint reads "pending" here
      # forever. The repo is public, so this needs no token.
      if ! CI_STATE=$(curl -fsS -m 15 "https://api.github.com/repos/$REPO/commits/$REMOTE/check-runs?per_page=100" |
        python3 -c 'import json,sys; runs=json.load(sys.stdin)["check_runs"]; ok={"success","skipped","neutral"}; print("pending" if not runs or any(r["status"]!="completed" for r in runs) else "success" if all(r["conclusion"] in ok for r in runs) else "failure")'); then
        echo "Could not read CI status for ${REMOTE:0:8}"
        exit 1
      fi
      if [ "$CI_STATE" != "success" ]; then
        echo "Skipping ${REMOTE:0:8}: CI state is $CI_STATE"
        exit 0
      fi

      echo "Deploying ${REMOTE:0:8}..."
      git pull --ff-only origin "$BRANCH"

      if install_and_restart && healthy; then
        rm -f "$FAILED_SHA"
        echo "Update completed successfully"
        notify "deployed ${REMOTE:0:8}" default
        exit 0
      fi

      echo "${REMOTE:0:8} did not come up; rolling back to ${LOCAL:0:8}"
      mkdir -p "$(dirname "$FAILED_SHA")"
      echo "$REMOTE" > "$FAILED_SHA"
      git reset --hard "$LOCAL"

      if install_and_restart && healthy; then
        notify "rolled back to ${LOCAL:0:8}: ${REMOTE:0:8} failed to start" high
      else
        notify "DOWN: ${REMOTE:0:8} failed and the rollback to ${LOCAL:0:8} did not come up either" urgent
      fi
      exit 1

  # GitOps systemd service
  - path: /etc/systemd/system/gitops-update.service
    content: |
      [Unit]
      Description=Check for git updates and restart if needed

      [Service]
      Type=oneshot
      User=yakshears
      ExecStart=/usr/local/bin/gitops-update.sh
      StandardOutput=journal
      StandardError=journal

  # GitOps systemd timer (runs every 5 minutes)
  - path: /etc/systemd/system/gitops-update.timer
    content: |
      [Unit]
      Description=Run GitOps update every 5 minutes

      [Timer]
      OnBootSec=5min
      OnUnitActiveSec=5min
      Persistent=true

      [Install]
      WantedBy=timers.target

  # Reshape journald's JSON into the four fields worth reading later
  - path: /usr/local/bin/journal-to-jsonl.py
    permissions: '0755'
    content: |
      #!/usr/bin/env python3
      """Read `journalctl -o json` on stdin, write compact log records on stdout."""

      import json
      import sys
      from datetime import UTC, datetime

      # syslog severities, which journald reports numerically
      LEVELS = ["emerg", "alert", "crit", "error", "warning", "notice", "info", "debug"]
      # Anything the app prints lands at severity 6 regardless of what it says, so
      # its own prefix is the only signal that a line is a warning or an error.
      PREFIXES = {"ERROR:": "error", "WARNING:": "warning", "CRITICAL:": "crit"}


      def level_of(record: dict, message: str) -> str:
          for prefix, level in PREFIXES.items():
              if message.startswith(prefix):
                  return level
          try:
              return LEVELS[int(record.get("PRIORITY", 6))]
          except (ValueError, IndexError):
              return "info"


      for line in sys.stdin:
          try:
              record = json.loads(line)
          except json.JSONDecodeError:
              continue
          message = record.get("MESSAGE") or ""
          if isinstance(message, list):  # journald renders non-UTF-8 as a byte array
              message = bytes(message).decode("utf-8", "replace")
          stamp = int(record.get("__REALTIME_TIMESTAMP", 0)) / 1_000_000
          print(
              json.dumps(
                  {
                      "timestamp": datetime.fromtimestamp(stamp, UTC).isoformat(),
                      "level": level_of(record, message),
                      "message": message,
                      "unit": record.get("_SYSTEMD_UNIT", ""),
                  }
              ),
              flush=False,
          )

  # Daily log export into the Syncthing folder
  - path: /usr/local/bin/export-logs.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail

      LOG_DIR=/home/yakshears/logs
      RETAIN_DAYS=30
      DAY=$(date -d yesterday +%F)

      mkdir -p "$LOG_DIR"
      # A finished day is written once and never touched again, so Syncthing
      # transfers each file a single time.
      journalctl -u yak-shears -u caddy -u gitops-update -o json \
        --since "$DAY" --until "$(date +%F)" |
        /usr/local/bin/journal-to-jsonl.py > "$LOG_DIR/$DAY.jsonl"

      chown -R yakshears:yakshears "$LOG_DIR"
      find "$LOG_DIR" -name '*.jsonl' -mtime "+$RETAIN_DAYS" -delete

  - path: /etc/systemd/system/export-logs.service
    content: |
      [Unit]
      Description=Export yesterday's journal into the Syncthing log folder

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/export-logs.sh
      StandardOutput=journal
      StandardError=journal

  - path: /etc/systemd/system/export-logs.timer
    content: |
      [Unit]
      Description=Export the journal once a day

      [Timer]
      OnCalendar=*-*-* 00:20:00
      Persistent=true

      [Install]
      WantedBy=timers.target

  # Caddy reverse proxy configuration
  - path: /etc/caddy/Caddyfile
    content: |
      {
          email dev.act.kyle+caddy@gmail.com  # REPLACE with your email for Let's Encrypt
      }

      yak-shears.kyleking.me {  # REPLACE with your domain
          reverse_proxy localhost:8084 {
              header_up Host {host}
              header_up X-Real-IP {remote_host}
              header_up X-Forwarded-For {remote_host}
              header_up X-Forwarded-Proto {scheme}
          }

          # Levels are set explicitly because the defaults lose. Caddy's
          # stock zstd is level 3, which on main.css is 22.1KB, worse than
          # its own gzip at 20.0KB. zstd best is 19.2KB. Static assets are
          # served immutable, so they are compressed rarely and the extra
          # CPU per request does not repeat.
          encode {
              zstd best
              gzip 9
          }

          # Security headers
          header {
              Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
              X-Content-Type-Options "nosniff"
              X-Frame-Options "DENY"
              Referrer-Policy "same-origin"
              X-XSS-Protection "1; mode=block"
              Permissions-Policy "geolocation=(), microphone=(), camera=()"
          }

          # Logging
          log {
              output file /var/log/caddy/yak-shears.log
          }
      }

runcmd:
  # Configure fail2ban for SSH protection
  - printf "[sshd]\nenabled = true\nport = ssh, 2222\nbanaction = iptables-multiport" > /etc/fail2ban/jail.local || exit 1
  - systemctl enable fail2ban || exit 1
  - systemctl start fail2ban || exit 1

  # Configure UFW firewall
  - ufw allow 2222/tcp || exit 1    # SSH
  - ufw allow http/tcp || exit 1    # HTTP (for ACME challenge)
  - ufw allow https/tcp || exit 1   # HTTPS
  - ufw allow 22000/tcp || exit 1   # Syncthing data
  - ufw allow 22000/udp || exit 1   # Syncthing data
  - ufw allow 21027/udp || exit 1   # Syncthing discovery
  - ufw --force enable || exit 1

  # Update package lists
  - apt update || exit 1

  # Install uv (Python package manager; also provisions a managed CPython during sync)
  - sudo -u yakshears sh -c 'curl -LsSf https://astral.sh/uv/install.sh | sh' || exit 1

  # Install Syncthing
  - mkdir -p /etc/apt/keyrings || exit 1
  - curl -L -o /etc/apt/keyrings/syncthing-archive-keyring.gpg https://syncthing.net/release-key.gpg || exit 1
  - echo "deb [signed-by=/etc/apt/keyrings/syncthing-archive-keyring.gpg] https://apt.syncthing.net/ syncthing stable" | tee /etc/apt/sources.list.d/syncthing.list || exit 1
  - apt update || exit 1
  - apt install -y syncthing || exit 1

  # Install Caddy. Non-interactive + force-confold: /etc/caddy/Caddyfile was
  # already written above by write_files, so dpkg would otherwise stop and
  # prompt at a conffile conflict, aborting the rest of runcmd.
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg || exit 1
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | tee /etc/apt/sources.list.d/caddy-stable.list || exit 1
  - apt update || exit 1
  - DEBIAN_FRONTEND=noninteractive apt install -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" caddy || exit 1

  # Setup Yak Shears directories
  - mkdir -p /home/yakshears/Sync/yak-shears || exit 1
  - chown -R yakshears:yakshears /home/yakshears/Sync || exit 1
  # Logs get their own Syncthing folder, which has to sit outside ~/Sync because
  # Syncthing refuses to nest one folder inside another
  - mkdir -p /home/yakshears/logs || exit 1
  - chown yakshears:yakshears /home/yakshears/logs || exit 1

  # Clone repository and install dependencies
  # NOTE: For private repos, add SSH deploy key to GitHub and update URL to git@github.com:...
  - sudo -u yakshears git clone https://github.com/KyleKing/yak-shears.git /home/yakshears/yak-shears || exit 1
  - sudo -u yakshears sh -c 'cd /home/yakshears/yak-shears && /home/yakshears/.local/bin/uv sync --no-dev --frozen && .venv/bin/types-for-jinja wrapper' || exit 1

  # Enable and start Syncthing
  - systemctl enable syncthing@yakshears.service || exit 1
  - systemctl start syncthing@yakshears.service || exit 1

  # Enable and start Caddy
  - systemctl enable caddy || exit 1
  - systemctl start caddy || exit 1

  # Enable and start Yak Shears
  - systemctl enable yak-shears || exit 1
  - systemctl start yak-shears || exit 1

  # Setup GitOps and log-export timers
  - systemctl daemon-reload || exit 1
  - systemctl enable gitops-update.timer || exit 1
  - systemctl start gitops-update.timer || exit 1
  - systemctl enable export-logs.timer || exit 1
  - systemctl start export-logs.timer || exit 1

  # Apply hardened SSH config. Ubuntu 22.10+ socket-activates sshd (ssh.socket
  # owns the listen port and ignores `Port 2222` in sshd_config), so disable the
  # socket and run ssh.service traditionally.
  - systemctl disable --now ssh.socket || true
  - systemctl enable ssh.service || exit 1
  - systemctl restart ssh.service || exit 1

  # Reboot to ensure clean state
  - sleep 10 && reboot
